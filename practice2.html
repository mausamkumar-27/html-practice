<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
    <h1>Students Registration Form:-</h1>
    <div>
        <label for="username">username:</label>
        <input id="username" type="text" name="user" placeholder="Enter Your Name">
    </div>
    <div>
        <label for="email">Email:</label>
        <input id="email" type="email" name="email"  placeholder="Enter Your email" required>
    </div>
    <div>
        <label for="no">Phone No.:</label>
        <input id="no" type="text"
    </div>
    <div>
    <label for="password">Password:</label>
    <input id="password" type="password" name="password" placeholder="Enter Your Password">
    </div>
    <div>
        <label for="male">Gender:</label>

        <input id="male" type="radio" name="gender">
        <label for="male">Male</label>

        <input id="female" type="radio" name="gender">
        <label for="female">Female</label>

        <input id="other" type="radio" name="gender">
        <label for="other">Other</label>
    </div>
    <label for="AI">Enrolled Courses:</label>

    <input id="AI" type="checkbox" name="enrolled courses">
    <label for="AI">AI</label>

    <input id="Data Science" type="checkbox" name="enrolled courses">
    <label for="Data Science">Data Science</label>

    <input id="cs" type="checkbox" name="enrolled course">
    <label for="cs">Cyber Security</label>

    </form>
    
</body>
</html>
