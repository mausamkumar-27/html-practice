<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    <link href="style.css" rel="stylesheet"
</head>
<body>
    <form action="/server" method="POST">
        <div>
 <label for="name">Username:</label>
    <input type="text" name="user" id="name" placeholder="Enter your name">
    </div>
    <div>
    <label for="pwd">Password:</label>
    <input type="password" name="" id="pwd" placeholder="Enter your password">
    </div>
    <div>
    <label>Gender:</label>
    <input type="radio" name="gender" id="male" value="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" id="female" value="female">
    <label for="female">Female</label>
    </div>
    <div>
        <label>Skills:</label>
        <input type="checkbox" name="Skills" id="html" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" name="Skills" id="css" value="css">
        <label for="css">CSS</label>
    </div>
    <div>
        <button type="submit">Submit Form</button>
    </div>
    </form>
</body>
</html>
